name: dbt Pipeline

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'   # chạy mỗi ngày lúc 1:00 AM UTC
  workflow_dispatch:        # cho phép chạy thủ công từ GitHub UI

jobs:
  load:
    name: Ingest data into Snowflake
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install snowflake-connector-python

      - name: Run COPY INTO
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
        run: python scripts/load_snowflake.py

  dbt-run:
    name: Run dbt (transform + test)
    runs-on: ubuntu-latest

    env:
      DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry==2.3.3

      - name: Install dependencies
        run: poetry install --no-root

      - name: dbt debug (kiểm tra kết nối)
        run: poetry run dbt debug --profiles-dir ./

      - name: dbt run (transform)
        run: poetry run dbt run --target dev --profiles-dir ./

      - name: dbt test
        run: poetry run dbt test --target dev --profiles-dir ./

      - name: Upload dbt logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-logs
          path: logs/
